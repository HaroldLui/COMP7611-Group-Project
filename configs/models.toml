# Model profiles. Choose one with:  python -m harness.run --profile <name> ...
#
# API keys never go in this file: put them in .env (copy .env.example) and name the
# variable with `api_key_env`. Model names below are examples -- check your provider's
# current model list and replace them. Whatever you choose, record it in
# docs/preregistration.md and keep it fixed for the whole test run.
#
# Fields for backend = "openai" (any OpenAI-compatible Chat Completions endpoint):
#   model             required; the model must support tool/function calling
#   base_url          provider endpoint (omit for api.openai.com)
#   api_key_env       name of the env var holding the key
#   temperature       optional; omit to use the provider default (some reasoning models reject it)
#   max_tokens        per-call output cap (default 4096)
#   max_tokens_param  "max_tokens" (default) or "max_completion_tokens" (newer OpenAI models)
#   reasoning_effort  optional, for reasoning models that accept it
#   seed              optional, if the provider supports it
#   extra_body        optional table of provider-specific fields
#
# Fields for backend = "anthropic": model, effort, max_tokens, api_key_env.

[profiles.fake]                 # offline plumbing test, no key needed
backend = "fake"

[profiles.openai]
backend = "openai"
api_key_env = "OPENAI_API_KEY"
model = "REPLACE_WITH_MODEL_NAME"
max_tokens_param = "max_completion_tokens"

[profiles.deepseek]
backend = "openai"
base_url = "https://ark.cn-beijing.volces.com/api/plan/v3"
api_key_env = "DEEPSEEK_API_KEY"
model = "deepseek-v4.1-flash"

[profiles.ark]                  # Volcengine Ark (Beijing), OpenAI-compatible Chat Completions
backend = "openai"
base_url = "https://ark.cn-beijing.volces.com/api/v3"
api_key_env = "ARK_API_KEY"
model = "kimi-k3.1-pro"

[profiles.qwen]                # Alibaba DashScope, international endpoint
backend = "openai"
base_url = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
api_key_env = "DASHSCOPE_API_KEY"
model = "qwen-plus"

[profiles.gemini]               # Gemini via its OpenAI-compatible endpoint
backend = "openai"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
api_key_env = "GEMINI_API_KEY"
model = "REPLACE_WITH_MODEL_NAME"

[profiles.openrouter]           # one key, many providers; model looks like "vendor/model"
backend = "openai"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
model = "REPLACE_WITH_MODEL_NAME"

[profiles.local]                # Ollama (vLLM: http://localhost:8000/v1); small models are weak at tool use
backend = "openai"
base_url = "http://localhost:11434/v1"
api_key_env = "LOCAL_API_KEY"   # any non-empty value, e.g. LOCAL_API_KEY=ollama
model = "REPLACE_WITH_MODEL_NAME"

[profiles.claude]
backend = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
model = "claude-opus-5-5"
effort = "medium"
